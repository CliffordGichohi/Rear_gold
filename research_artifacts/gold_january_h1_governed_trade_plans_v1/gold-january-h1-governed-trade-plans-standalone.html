:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

a:is(:hover, :focus-visible) {

}

h2,
h3,
h4,
h5,
h6,

}

}

b,
strong,

}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {

  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

}

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;

  pointer-events: none;
  user-select: none;

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

  display: flex;
  flex-direction: column;
  gap: 2px;

.viz-stat-value {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);

.text-muted {

}

.tabular-nums {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {

  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {

}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);

  margin-right: 8px;
  padding: 0 8px;

  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);

  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

.form-check:not(.form-switch)

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

}

.form-check:not(.form-switch)

  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;

.form-check-input[type=&quot;radio&quot;] {

  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {

  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

.form-range::-webkit-slider-runnable-track {

.form-range:focus-visible::-webkit-slider-thumb {

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range:disabled {

      const indexAt = (bars, seconds) =&gt; bars.findIndex(row =&gt; row[0] === Number(seconds));
      const localRay = (svg, x, y, plotRight, color, label, kind) =&gt; {

      function draw(container, timeframe, sample) {
        container.replaceChildren();
        const plan = sample.plan;
        const evidence = plan.source_evidence;
        const bars = sample.charts[timeframe].bars;
        const measured = Math.max(300, Math.floor(container.getBoundingClientRect().width || 736));
        const height = timeframe === &quot;H1&quot; ? (measured &lt; 430 ? 222 : 242) : (measured &lt; 430 ? 205 : 224);
        const margin = { left: 58, right: 14, top: 21, bottom: 30 };
        const plotLeft = margin.left, plotRight = measured - margin.right, plotTop = margin.top, plotBottom = height - margin.bottom;
        const annotationWidth = measured &lt; 430 ? 88 : 150;
        const barRight = plotRight - annotationWidth;
        const plotWidth = plotRight - plotLeft, barWidth = barRight - plotLeft, plotHeight = plotBottom - plotTop;
        const values = bars.flatMap(row =&gt; [row[3], row[4]]);
        if (timeframe === &quot;H1&quot;) {
          values.push(plan.destination.level, plan.governing_h1_auction.governing_invalidation_level);
          if (plan.family === &quot;RANGE&quot;) values.push(plan.governing_h1_auction.range.lower_boundary, plan.governing_h1_auction.range.upper_boundary);

        if (timeframe === &quot;M15&quot;) {

        svg.appendChild(attrs(svgEl(&quot;rect&quot;), { x: plotLeft, y: plotTop, width: plotWidth, height: plotHeight, fill: &quot;#ffffff&quot;, stroke: &quot;#d1d5db&quot;, &quot;stroke-width&quot;: 1, &quot;data-chart-frame&quot;: timeframe }));

        if (timeframe === &quot;M15&quot;) {
          const controlIndex = indexAt(bars, evidence.m15_control.pivot_at ? Date.parse(evidence.m15_control.pivot_at) / 1000 : -1);
          const terminalIndex = evidence.m15_terminal ? indexAt(bars, Date.parse(evidence.m15_terminal.pivot_at) / 1000) : -1;
          const zoneStart = Math.max(0, controlIndex, terminalIndex);
          const zx = x(zoneStart) - width;
          const upper = y(plan.m15_setup.zone_upper), lower = y(plan.m15_setup.zone_lower);
          svg.appendChild(attrs(svgEl(&quot;rect&quot;), { x: zx, y: upper, width: Math.max(4, plotRight - zx), height: Math.max(2, lower - upper), fill: &quot;#7c3aed&quot;, opacity: 0.10, &quot;data-m15-location&quot;: &quot;true&quot; }));
          line(svg, zx, upper, barRight, upper, &quot;#7c3aed&quot;, 1);
          line(svg, zx, lower, barRight, lower, &quot;#7c3aed&quot;, 1);

        bars.forEach((row, index) =&gt; {
          const open = row[2], high = row[3], low = row[4], close = row[5];
          const color = close &gt;= open ? &quot;#089981&quot; : &quot;#f23645&quot;;
          line(svg, x(index), y(high), x(index), y(low), color, 1.1);
          svg.appendChild(attrs(svgEl(&quot;rect&quot;), { x: x(index) - width / 2, y: Math.min(y(open), y(close)), width, height: Math.max(1.4, Math.abs(y(open) - y(close))), fill: color, &quot;data-candle&quot;: timeframe, &quot;data-open-time&quot;: row[0] }));
        });

        if (timeframe === &quot;H1&quot;) {
          text(svg, plotLeft + 7, plotTop + 15, plan.governing_h1_auction.state.replaceAll(&quot;_&quot;, &quot; &quot;), &quot;jhp-label&quot;);
          const control = evidence.h1_governing_control;
          const ci = indexAt(bars, Date.parse(control.pivot_at) / 1000);
          if (ci &gt;= 0) pivotMarker(svg, x(ci), y(control.level), control.kind, &quot;#dc2626&quot;, &quot;&quot;);
          const destination = evidence.selected_destination;
          const di = indexAt(bars, Date.parse(destination.pivot_at) / 1000);
          if (destination.timeframe === &quot;H1&quot; &amp;&amp; di &gt;= 0) pivotMarker(svg, x(di), y(destination.level), destination.kind, &quot;#059669&quot;, &quot;&quot;);

          localRay(svg, ci &gt;= 0 ? x(ci) : plotRight - 120, y(plan.governing_h1_auction.governing_invalidation_level), plotRight, &quot;#dc2626&quot;, `H1 control ${formatPrice(plan.governing_h1_auction.governing_invalidation_level)}`, &quot;H1_CONTROL&quot;);
          if (plan.family === &quot;RANGE&quot;) {

          const control = evidence.m15_control;
          const ci = indexAt(bars, Date.parse(control.pivot_at) / 1000);
          if (ci &gt;= 0) pivotMarker(svg, x(ci), y(control.level), control.kind, &quot;#7c3aed&quot;, &quot;&quot;);
          if (evidence.m15_terminal) {
            const terminal = evidence.m15_terminal, ti = indexAt(bars, Date.parse(terminal.pivot_at) / 1000);
            if (ti &gt;= 0) pivotMarker(svg, x(ti), y(terminal.level), terminal.kind, &quot;#2962ff&quot;, &quot;&quot;);

          text(svg, plotLeft + 4, 14, `M15 control ${formatPrice(control.level)} | zone ${formatPrice(plan.m15_setup.zone_lower)}-${formatPrice(plan.m15_setup.zone_upper)}`, &quot;jhp-note&quot;);
          if (plan.destination.timeframe === &quot;M15&quot;) {

          }

            svg.appendChild(attrs(svgEl(&quot;circle&quot;), { cx: x(retestIndex), cy: y(plan.m5_execution.retest_extreme), r: 6.2, fill: &quot;#d97706&quot;, &quot;data-m5-retest&quot;: &quot;true&quot; }));
            text(svg, x(retestIndex), y(plan.m5_execution.retest_extreme) + 4, &quot;R&quot;, &quot;jhp-marker-letter&quot;, &quot;middle&quot;);
          }
          const anchor = retestIndex &gt;= 0 ? x(retestIndex) : plotRight - 130;
          localRay(svg, anchor, y(plan.entry.level), plotRight, &quot;#2962ff&quot;, `Entry ${formatPrice(plan.entry.level)}`, &quot;ENTRY&quot;);
          localRay(svg, anchor, y(plan.invalidation.level), plotRight, &quot;#dc2626&quot;, `SL ${formatPrice(plan.invalidation.level)}`, &quot;STOP&quot;);

      }

      function render() {
        const sample = data.samples[selected], plan = sample.plan;
        select.value = String(selected);

        [
          `Entry ${formatPrice(plan.entry.level)}`,

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;

  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;

  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)

      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)

    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {

  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    const trigger = getTrigger(event.target);

  document.addEventListener(&quot;pointercancel&quot;, handlePointer);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
