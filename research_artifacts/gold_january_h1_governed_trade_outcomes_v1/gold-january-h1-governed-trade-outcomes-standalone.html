:root[data-theme=&quot;light&quot;] {

;:true,&quot;m1FirstPassage&quot;:true,&quot;sameBarStopFirst&quot;:true,&quot;grossBeforeCosts&quot;:true,&quot;overlapUnconstrained&quot;:true,&quot;primaryReferenceExact&quot;:true},&quot;sourceHashes&quot;:{&quot;spec&quot;:&quot;31e6019b44762853013fb38a084e40619ebef61002d89e6524f1ff5322986a75&quot;,&quot;evaluator&quot;:&quot;b5adf10b968bf60c143cf133242b1315e74510b87f9716b585a545d48d544ded&quot;,&quot;renderer&quot;:&quot;feccd48adf5ebd838ac1964e8445d30f782d484d98aaf4f5694307700e015466&quot;,&quot;certification&quot;:&quot;0124f64bae5a2fceff10e63b43b08381e4fec702d3b2a09c6d97c8772617dcef&quot;,&quot;plans&quot;:&quot;6a5cf65a2bbd6c3a41b7c53540a2f96017da6b366d3f491350a9c05fd54947e6&quot;,&quot;planManifest&quot;:&quot;b733a8801bddd77a2d119d89317183d3eaa3239fecb406b9d390b93c5c8b0490&quot;,&quot;outcomes&quot;:&quot;1047ad8aaab4e3c8a479d779208a1e7f6992b4a6395f1092662469e3dbc8ab84&quot;,&quot;primaryLineage&quot;:&quot;3454d9af47058797318e24208bfbedf8852c1f6b31dfeb7c88ebe73e22fd9ea2&quot;,&quot;referenceLineage&quot;:&quot;49281360c60f452370b262d755ff2ee39ec6850a8b4da8b0580d89a31ce2b20b&quot;},&quot;dataSha256&quot;:&quot;96ec22b404719332ecfe1566803be52fcedc2bfcfceaad1cd12e34a4a4666d0f&quot;}&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;gold-january-h1-governed-outcomes-v1&quot;);
      const data = JSON.parse(root.querySelector(&quot;#jgo-data&quot;).textContent);
      const chart = root.querySelector(&quot;#jgo-chart&quot;);
      const detail = root.querySelector(&quot;#jgo-detail&quot;);
      const ledger = root.querySelector(&quot;#jgo-ledger&quot;);
      const NS = &quot;http://www.w3.org/2000/svg&quot;;
      let timeframe = &quot;M15&quot;;
      let selected = -1;
      let start = 0;
      let end = data.bars[timeframe].length - 1;
      let resizeTimer = 0;
      const svgEl = name =&gt; document.createElementNS(NS, name);
      const attrs = (node, values) =&gt; { Object.entries(values).forEach(([key, value]) =&gt; node.setAttribute(key, String(value))); return node; };
      const addText = (svg, x, y, value, className, anchor = &quot;start&quot;, extra = {}) =&gt; {
        const node = attrs(svgEl(&quot;text&quot;), { x, y, class: className, &quot;text-anchor&quot;: anchor, ...extra });
        node.textContent = value; svg.appendChild(node); return node;
      };
      const addLine = (svg, x1, y1, x2, y2, color, width = 1, extra = {}) =&gt; {
        const node = attrs(svgEl(&quot;line&quot;), { x1, y1, x2, y2, stroke: color, &quot;stroke-width&quot;: width, &quot;vector-effect&quot;: &quot;non-scaling-stroke&quot;, ...extra });
        svg.appendChild(node); return node;
      };
      const price = value =&gt; Number(value).toFixed(2);
      const signedR = value =&gt; `${Number(value) &gt;= 0 ? &quot;+&quot; : &quot;&quot;}${Number(value).toFixed(2)}R`;
      const dateTime = seconds =&gt; new Intl.DateTimeFormat(&quot;en-GB&quot;, { timeZone: &quot;UTC&quot;, month: &quot;short&quot;, day: &quot;2-digit&quot;, hour: &quot;2-digit&quot;, minute: &quot;2-digit&quot;, hour12: false }).format(new Date(seconds * 1000));
      const duration = minutes =&gt; minutes &lt; 60 ? `${minutes}m` : minutes &lt; 1440 ? `${(minutes / 60).toFixed(1)}h` : `${(minutes / 1440).toFixed(1)}d`;
      const dispositionLabel = value =&gt; ({ TARGET: &quot;Target&quot;, STOP: &quot;Stop&quot;, STOP_FIRST_AMBIGUOUS: &quot;Stop (same M1 bar)&quot;, MONTH_END_MARK: &quot;Month-end mark&quot; }[value] || value);
      const dispositionColor = value =&gt; value === &quot;TARGET&quot; ? &quot;#059669&quot; : value === &quot;MONTH_END_MARK&quot; ? &quot;#d97706&quot; : &quot;#dc2626&quot;;

      function lowerBound(bars, seconds) {
        let lo = 0, hi = bars.length;
        while (lo &lt; hi) { const mid = (lo + hi) &gt;&gt; 1; if (bars[mid][0] &lt; seconds) lo = mid + 1; else hi = mid; }
        return lo;
      }

      function fractionalIndex(bars, seconds) {
        const next = lowerBound(bars, seconds);
        if (next &lt;= 0) return 0;
        if (next &gt;= bars.length) return bars.length - 1;
        if (bars[next][0] === seconds) return next;
        const previous = next - 1;
        const span = bars[next][0] - bars[previous][0];
        const fraction = span &gt; 0 ? Math.max(0, Math.min(1, (seconds - bars[previous][0]) / span)) : 0;
        return previous + fraction;
      }

      function resetView() {
        const bars = data.bars[timeframe]; start = 0; end = bars.length - 1; render();
      }

      function setView(center, count) {
        const bars = data.bars[timeframe];
        const size = Math.max(2, Math.min(bars.length, Math.round(count)));
        let left = Math.round(center - size / 2);
        left = Math.max(0, Math.min(left, bars.length - size));
        start = left; end = left + size - 1; render();
      }

      function zoom(factor) {
        const bars = data.bars[timeframe];
        const current = end - start + 1;
        const minimum = timeframe === &quot;H1&quot; ? 40 : timeframe === &quot;M15&quot; ? 120 : 360;
        const next = Math.max(minimum, Math.min(bars.length, current * factor));
        const center = selected &gt;= 0 ? fractionalIndex(bars, data.plans[selected].decision) : (start + end) / 2;
        setView(center, next);
      }

      function pan(direction) {
        const count = end - start + 1;
        setView((start + end) / 2 + direction * count * 0.38, count);
      }

      function selectPlan(index) {
        selected = selected === index ? -1 : index;
        render();
      }

      function renderMetrics() {
        const s = data.summary;
        const hitRate = s.resolved_hit_rate == null ? &quot;n/a&quot; : `${(100 * s.resolved_hit_rate).toFixed(1)}%`;
        const values = [
          `&lt;strong&gt;${s.plans}&lt;/strong&gt; plans`,
          `&lt;strong&gt;${s.target_hits}&lt;/strong&gt; targets`,
          `&lt;strong&gt;${s.stops + s.stop_first_ambiguous}&lt;/strong&gt; stopped`,
          `&lt;strong&gt;${s.month_end_marks}&lt;/strong&gt; marked`,
          `&lt;strong&gt;${hitRate}&lt;/strong&gt; resolved hit rate`,
          `&lt;strong&gt;${signedR(s.gross_r_sum)}&lt;/strong&gt; gross total`,
        ];
        root.querySelector(&quot;#jgo-metrics&quot;).innerHTML = values.map(value =&gt; `&lt;span&gt;${value}&lt;/span&gt;`).join(&quot;&quot;);
      }

      function renderLedger() {
        ledger.replaceChildren();
        data.plans.forEach((plan, index) =&gt; {
          const row = document.createElement(&quot;tr&quot;); row.dataset.selected = String(index === selected); row.dataset.planRow = String(plan.number);
          const number = document.createElement(&quot;td&quot;);
          const button = document.createElement(&quot;button&quot;); button.type = &quot;button&quot;; button.className = &quot;jgo-row-button&quot;; button.textContent = String(plan.number); button.setAttribute(&quot;aria-label&quot;, `Highlight setup ${plan.number}`); button.addEventListener(&quot;click&quot;, () =&gt; selectPlan(index));
          number.appendChild(button); row.appendChild(number);
          [dateTime(plan.decision), plan.direction, `${plan.family} · ${plan.h1State.replaceAll(&quot;_&quot;, &quot; &quot;)}`, dispositionLabel(plan.disposition)].forEach(value =&gt; { const cell = document.createElement(&quot;td&quot;); cell.textContent = value; row.appendChild(cell); });
          const result = document.createElement(&quot;td&quot;); result.textContent = signedR(plan.grossR); result.className = plan.grossR &gt;= 0 ? &quot;positive&quot; : &quot;negative&quot;; row.appendChild(result);
          const target = document.createElement(&quot;td&quot;); target.textContent = signedR(plan.targetR); row.appendChild(target);
          const elapsed = document.createElement(&quot;td&quot;); elapsed.textContent = duration(plan.durationMinutes); row.appendChild(elapsed);
          ledger.appendChild(row);
        });
      }

      function renderChart() {
        chart.replaceChildren();
        const bars = data.bars[timeframe];
        const measured = Math.max(300, Math.floor(chart.getBoundingClientRect().width || 736));
        const height = measured &lt; 440 ? 340 : measured &lt; 760 ? 410 : 500;
        const margin = { left: 58, right: 12, top: 30, bottom: 34 };
        const plotLeft = margin.left, plotRight = measured - margin.right, plotTop = margin.top, plotBottom = height - margin.bottom;
        const plotWidth = plotRight - plotLeft, plotHeight = plotBottom - plotTop;
        const visible = bars.slice(start, end + 1);
        const activePlans = data.plans.filter(plan =&gt; {
          const from = fractionalIndex(bars, plan.decision), to = fractionalIndex(bars, plan.resolution);
          return Math.max(from, start) &lt;= Math.min(to, end);
        });
        const values = visible.flatMap(row =&gt; [row[2], row[3]]);
        activePlans.forEach(plan =&gt; values.push(plan.entry, plan.stop, plan.target));
        let min = Math.min(...values), max = Math.max(...values);
        const padding = Math.max((max - min) * 0.055, 0.35); min -= padding; max += padding;
        const x = index =&gt; plotLeft + ((index - start + 0.5) / Math.max(1, end - start + 1)) * plotWidth;
        const y = value =&gt; plotTop + ((max - value) / Math.max(0.000001, max - min)) * plotHeight;
        const candleWidth = Math.max(0.45, Math.min(7, (plotWidth / Math.max(1, visible.length)) * 0.58));
        const svg = attrs(svgEl(&quot;svg&quot;), { viewBox: `0 0 ${measured} ${height}`, role: &quot;img&quot;, &quot;aria-label&quot;: `${timeframe} continuous January chart with twelve frozen plan outcomes`, &quot;data-timeframe&quot;: timeframe, &quot;data-visible-bars&quot;: visible.length });
        const title = svgEl(&quot;title&quot;); title.textContent = `${timeframe} January 2022 continuous plan outcomes`; svg.appendChild(title);
        const defs = svgEl(&quot;defs&quot;); const clip = attrs(svgEl(&quot;clipPath&quot;), { id: &quot;jgo-plot-clip&quot; }); clip.appendChild(attrs(svgEl(&quot;rect&quot;), { x: plotLeft, y: plotTop, width: plotWidth, height: plotHeight })); defs.appendChild(clip); svg.appendChild(defs);
        svg.appendChild(attrs(svgEl(&quot;rect&quot;), { x: plotLeft, y: plotTop, width: plotWidth, height: plotHeight, fill: &quot;#ffffff&quot;, stroke: &quot;#d1d5db&quot;, &quot;stroke-width&quot;: 1, &quot;data-chart-frame&quot;: &quot;true&quot; }));
        for (let tick = 0; tick &lt; 5; tick += 1) {
          const value = min + (max - min) * tick / 4, py = y(value);
          addLine(svg, plotLeft, py, plotRight, py, &quot;#e5e7eb&quot;);
          addText(svg, plotLeft - 7, py + 4, price(value), &quot;jgo-axis&quot;, &quot;end&quot;);
        }
        const timeTickCount = measured &lt; 440 ? 3 : measured &lt; 760 ? 5 : 7;
        for (let tick = 0; tick &lt; timeTickCount; tick += 1) {
          const index = Math.round(start + (end - start) * tick / Math.max(1, timeTickCount - 1));
          const anchor = tick === 0 ? &quot;start&quot; : tick === timeTickCount - 1 ? &quot;end&quot; : &quot;middle&quot;;
          addText(svg, x(index), height - 8, dateTime(bars[index][0]), &quot;jgo-axis&quot;, anchor);
        }
        addText(svg, plotLeft + 5, 18, `${timeframe} · ${visible.length.toLocaleString()} bars visible · ${dateTime(bars[start][0])} → ${dateTime(bars[end][0])}`, &quot;jgo-label&quot;);

        const candleGroup = attrs(svgEl(&quot;g&quot;), { &quot;clip-path&quot;: &quot;url(#jgo-plot-clip)&quot; });
        visible.forEach((row, offset) =&gt; {
          const index = start + offset, open = row[1], high = row[2], low = row[3], close = row[4];
          const color = close &gt;= open ? &quot;#089981&quot; : &quot;#f23645&quot;;
          candleGroup.appendChild(attrs(svgEl(&quot;line&quot;), { x1: x(index), y1: y(high), x2: x(index), y2: y(low), stroke: color, &quot;stroke-width&quot;: 1, &quot;vector-effect&quot;: &quot;non-scaling-stroke&quot; }));
          candleGroup.appendChild(attrs(svgEl(&quot;rect&quot;), { x: x(index) - candleWidth / 2, y: Math.min(y(open), y(close)), width: candleWidth, height: Math.max(1, Math.abs(y(open) - y(close))), fill: color, &quot;data-candle&quot;: timeframe, &quot;data-open-time&quot;: row[0] }));
        });
        svg.appendChild(candleGroup);

        activePlans.forEach(plan =&gt; {
          const index = plan.number - 1, isSelected = index === selected;
          const rawFrom = fractionalIndex(bars, plan.decision), rawTo = fractionalIndex(bars, plan.resolution);
          const from = Math.max(start, rawFrom), to = Math.min(end, Math.max(rawFrom + 0.15, rawTo));
          const x1 = x(from), x2 = x(to), opacity = isSelected ? 1 : 0.52, width = isSelected ? 2.4 : 1.25;
          addLine(svg, x1, y(plan.entry), x2, y(plan.entry), &quot;#2962ff&quot;, width, { opacity, &quot;data-plan-line&quot;: &quot;ENTRY&quot;, &quot;data-plan&quot;: plan.number });

      function renderDetail() {

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

  const skipDelay = 300;

  let pendingTrigger = null;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);

    clearOpenTimeout();
    pinnedByTouch = false;

      getContent(trigger).length === 0 ||
