name: gold-codex-operator-replay-e2e

services:
  codex-api:
    container_name: gold-codex-operator-replay-e2e-api
    build:
      context: ./backend
      target: runtime
    environment:
      APP_ENV: test
      API_CORS_ORIGINS: '["http://localhost:3012"]'
      CODEX_OPERATOR_REPLAY_ARTIFACT_PATH: /app/research_artifacts/codex_operator_replay_v1_e2e
      CODEX_OPERATOR_REPLAY_VISIBLE_LEDGER_PATH: /app/research_artifacts/codex_operator_replay_v1_e2e/ledgers/codex_blind_visible_ledger.jsonl
      CODEX_OPERATOR_REPLAY_OUTCOME_LEDGER_PATH: /app/research_artifacts/codex_operator_replay_v1_e2e/outcome_vault/codex_blind_outcome_ledger.jsonl
      BLIND_REPLAY_V3_LEDGER_PATH: /app/preserved_human/practice_event_ledger_v3.jsonl
    command: ["uvicorn", "gold_intel.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8012:8000"
    volumes:
      - ./.codex_runs/codex_operator_replay_e2e/artifact:/app/research_artifacts/codex_operator_replay_v1_e2e
      - ./research_artifacts/gold_annotated_replay_v3/ledgers:/app/preserved_human:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  codex-web:
    container_name: gold-codex-operator-replay-e2e-web
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8012/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8012/api/v1
      API_INTERNAL_URL: http://codex-api:8000/api/v1
    ports:
      - "3012:3000"
    depends_on:
      codex-api:
        condition: service_healthy
